spring.application.name=MaintenanceMate

# Tests use an in-memory H2 database so `mvn test` / `mvn package`
# work on any machine without a running MySQL server or DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:maintenancemate;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
