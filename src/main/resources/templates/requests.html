
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maintenance Requests | Maintenance Mate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            Maintenance Mate
        </a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light" type="submit">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5">

    <a th:href="@{/dashboard}" class="btn btn-link px-0">
        &larr; Back to Dashboard
    </a>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Maintenance Requests</h2>
        <a th:href="@{/requests/new}" class="btn btn-primary">
            + New Request
        </a>
    </div>

    <div th:if="${success}"
         class="alert alert-success"
         th:text="${success}">
    </div>

    <div th:if="${#lists.isEmpty(requests)}"
         class="alert alert-info">
        No maintenance requests found.
    </div>

    <div class="card shadow-sm mb-3"
         th:each="request : ${requests}">

        <div class="card-body">

            <div class="d-flex justify-content-between">
                <h5 th:text="${request.title}">Request Title</h5>
                <span class="badge bg-secondary"
                      th:text="${request.status}">OPEN</span>
            </div>

            <p class="text-muted mb-2">
                Apartment:
                <span th:text="${request.apartmentNumber}">204</span>
            </p>

            <p style="white-space: pre-wrap;"
               th:text="${request.description}">
                Request Description
            </p>

            <p class="text-muted small">
                Submitted by:
                <span th:text="${request.submittedBy}">resident</span>
            </p>

            <p class="text-muted small"
               th:if="${request.createdAt != null}"
               th:text="${#temporals.format(request.createdAt, 'MMM d, yyyy h:mm a')}">
            </p>

            <div class="d-flex gap-2">

                <a th:href="@{/requests/{id}/edit(id=${request.id})}"
                   class="btn btn-sm btn-outline-primary">
                    Edit
                </a>

                <form method="post"
                      th:action="@{/requests/{id}/delete(id=${request.id})}"
                      onsubmit="return confirm('Are you sure you want to delete this request?');">

                    <button type="submit"
                            class="btn btn-sm btn-outline-danger">
                        Delete
                    </button>

                </form>

            </div>
        </div>
    </div>

</div>
</body>
</html>
