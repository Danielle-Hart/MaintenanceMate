<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Announcement - MaintenanceMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4" style="max-width: 700px;">
        <h1>Post an Announcement</h1>

        <form th:action="@{/manager/announcements}" th:object="${announcement}" method="post">

            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input id="title" type="text" th:field="*{title}" maxlength="150"  oninput="document.getElementById('titleCount').textContent = this.value.length"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{title}"></div>
                <div class="form-text">
                    <span id="titleCount">0</span> / 150 characters
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label" for="message">Message</label>
                <textarea id="message" rows="6" th:field="*{message}" class="form-control"
                          th:classappend="${#fields.hasErrors('message')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{message}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Post</button>
            <a th:href="@{/announcements}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
