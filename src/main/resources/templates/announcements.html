<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Announcements | Maintenance Mate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">Maintenance Mate</a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5">

        <a th:href="@{/dashboard}" class="btn btn-link px-0">&larr; Back to Dashboard</a>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Property Announcements</h2>
            <a sec:authorize="hasAnyRole('ADMIN','MANAGER')"
               th:href="@{/manager/announcements/new}"
               class="btn btn-primary">+ New Announcement</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div th:if="${error}" class=" alert alert-danger"
             th:text="${error}"></div>
        <div th:if="${#lists.isEmpty(announcements)}" class="alert alert-info">
            No announcements right now.
        </div>

        <div class="card shadow-sm mb-3" th:each="a : ${announcements}">
            <div class="card-body">
                <h5 th:text="${a.title}">Title</h5>
                <h6 class="text-muted mb-2"
                    th:text="${'Posted by ' + a.postedBy + ' on ' + #temporals.format(a.createdAt, 'MMM d, yyyy h:mm a')}">
                </h6>
                <p style="white-space: pre-wrap;" th:text="${a.message}">Message</p>

                <form sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                      method="post"
                      th:action="@{/manager/announcements/{id}/delete(id=${a.id})}"
                      onsubmit="return confirm('Delete this announcement?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
