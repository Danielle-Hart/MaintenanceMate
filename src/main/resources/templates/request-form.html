
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maintenance Request | Maintenance Mate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            Maintenance Mate
        </a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 700px;">

    <a th:href="@{/requests}" class="btn btn-link px-0">
        &larr; Back to Requests
    </a>

    <h2 class="mb-4"
        th:text="${editing} ? 'Edit Maintenance Request' : 'New Maintenance Request'">
        Maintenance Request
    </h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:object="${request}"
                  th:action="${editing} ? @{/requests/{id}/edit(id=${request.id})} : @{/requests}"
                  method="post">

                <div class="mb-3">
                    <label for="title" class="form-label">
                        Request Title
                    </label>
                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           class="form-control"
                           maxlength="150"
                           required
                           placeholder="Example: Broken AC">

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="apartmentNumber" class="form-label">
                        Apartment Number
                    </label>
                    <input type="text"
                           id="apartmentNumber"
                           th:field="*{apartmentNumber}"
                           class="form-control"
                           required
                           placeholder="Example: 204">

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('apartmentNumber')}"
                         th:errors="*{apartmentNumber}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>
                    <textarea id="description"
                              th:field="*{description}"
                              class="form-control"
                              rows="5"
                              maxlength="2000"
                              required
                              placeholder="Describe the maintenance issue...">
                    </textarea>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${editing} ? 'Save Changes' : 'Submit Request'">
                        Submit Request
                    </button>

                    <a th:href="@{/requests}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
