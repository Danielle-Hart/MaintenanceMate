
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Maintenance Mate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">Maintenance Mate</span>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5">

    <h2>Welcome to Maintenance Mate!</h2>
    <p class="text-muted">
        Manage Apartment Maintenance Requests in One Place
    </p>

    <div class="row mt-4">

        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Maintenance Requests</h5>
                    <p>View, Create, and Manage Maintenance Requests</p>
                    <a th:href="@{/requests}" class="btn btn-primary">
                        View Maintenance Requests
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Property Announcements</h5>
                    <p>View Important Property Maintenance Updates</p>
                    <a th:href="@{/announcements}" class="btn btn-primary">
                        View Announcements
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
